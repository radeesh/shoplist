<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShopList - Minimal Shopping List</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-text">ShopList</span>
      </div>

      <div class="header-controls">
        <select id="activeListSelect" class="list-select" aria-label="Select List">
          <!-- Populated dynamically -->
        </select>
        <button id="btnNewList" class="btn-icon" title="New List">+</button>
        <button id="btnThemeToggle" class="btn-icon" title="Toggle Mode">◐</button>
        <button id="btnOpenMenu" class="btn-icon" title="Options">⚙</button>
      </div>
    </header>

    <!-- Progress Summary -->
    <section class="progress-section">
      <div class="progress-info">
        <span id="progressSummary">0 OF 0 ITEMS CHECKED</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Single Add Input with Collapsible Advanced Options -->
    <form id="addForm" class="add-form">
      <div class="add-main-row">
        <input 
          type="text" 
          id="itemNameInput" 
          class="input-text" 
          placeholder="Add item..." 
          autocomplete="off" 
          required
        >
        <button type="button" id="btnToggleAdvanced" class="btn-outline" title="Advanced Options">+ Advanced</button>
        <button type="submit" class="btn-primary">Add</button>
      </div>

      <div id="advancedOptions" class="advanced-options" style="display: none;">
        <div class="opt-group">
          <label for="itemQtyInput">QTY</label>
          <input type="number" id="itemQtyInput" class="input-text-sm" value="1" min="0" step="any">
        </div>
        <div class="opt-group">
          <label for="itemUnitInput">UNIT</label>
          <select id="itemUnitInput" class="input-text-sm"></select>
        </div>
        <div class="opt-group">
          <label for="itemPriceInput">PRICE ($)</label>
          <input type="number" id="itemPriceInput" class="input-text-sm" placeholder="0.00" min="0" step="0.01">
        </div>
      </div>
    </form>

    <!-- Toolbar: Search & Actions -->
    <section class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
      </div>

      <div class="toolbar-actions">
        <button id="btnResetChecked" class="btn-outline" title="Uncheck all items">Reset</button>
        <button id="btnClearCompleted" class="btn-outline" title="Remove checked items">Clear Done</button>
        <button id="btnExportList" class="btn-outline" title="Export">Export</button>
      </div>
    </section>

    <!-- Item List -->
    <section class="items-list" id="itemsContainer">
      <!-- Dynamic Item Cards -->
    </section>
  </div>

  <!-- Create List Modal -->
  <div class="modal-backdrop" id="listModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <span>Create List</span>
        <button class="modal-close" id="btnCloseListModal">✕</button>
      </div>
      <form id="listForm">
        <input type="text" id="listNameInput" class="input-text" placeholder="List Name" required style="width: 100%; margin-bottom: 16px;">
        <div class="modal-footer">
          <button type="button" class="btn-outline" id="btnCancelListModal">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Export & Import Modal -->
  <div class="modal-backdrop" id="exportModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-tabs">
          <button type="button" class="tab-btn active" id="tabExportBtn">Export</button>
          <button type="button" class="tab-btn" id="tabImportBtn">Import</button>
        </div>
        <button class="modal-close" id="btnCloseExportModal">✕</button>
      </div>

      <div id="exportTabContent">
        <div style="display: flex; gap: 16px; margin-top: 10px; margin-bottom: 10px; font-size: 0.85rem; font-weight: 600;">
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="exportScope" value="current" checked> Current List
          </label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="exportScope" value="all"> All Lists (Full Backup)
          </label>
        </div>
        <!-- Text options for sharing the current list (hidden for full backup) -->
        <div id="exportTextOptions" style="display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; font-size: 0.85rem; font-weight: 600;">
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="exportShow" value="todo" checked> To buy
          </label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="exportShow" value="done"> Done
          </label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="radio" name="exportShow" value="all"> All
          </label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="exportQty" checked> Qty
          </label>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="exportPrices"> Prices
          </label>
        </div>
        <textarea id="exportPreview" class="input-text" rows="8" readonly style="width: 100%; font-family: monospace; font-size: 0.82rem;"></textarea>
        <!-- Send the text straight to an app (hidden for full backup). hrefs are set in app.js -->
        <div id="exportShareIcons" style="display: flex; gap: 8px; margin-top: 10px;">
          <a class="btn-icon" id="shareWhatsApp" target="_blank" rel="noopener" title="WhatsApp" aria-label="Share on WhatsApp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </a>
          <a class="btn-icon" id="shareSms" title="Messages" aria-label="Share by text message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </a>
          <a class="btn-icon" id="shareEmail" title="Email" aria-label="Share by email">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </a>
          <button type="button" class="btn-icon" id="btnShareText" title="More apps" aria-label="Share to other apps" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
        </div>
        <div class="modal-footer" style="margin-top: 12px;">
          <button class="btn-primary" id="btnCopyFormatted">Copy Text</button>
          <button class="btn-outline" id="btnDownloadJSON">Download JSON</button>
        </div>
      </div>

      <div id="importTabContent" style="display: none;">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; margin-bottom: 8px;">
          Paste JSON array or plain text lines to restore items:
        </p>
        <textarea id="importInput" class="input-text" rows="8" placeholder='[{"name": "Milk", "quantity": 1}] or paste item lines...' style="width: 100%; font-family: monospace; font-size: 0.82rem;"></textarea>
        <div class="modal-footer" style="margin-top: 12px;">
          <button class="btn-primary" id="btnSubmitImport">Import Items</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Item Modal -->
  <div class="modal-backdrop" id="editItemModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <span>Edit Item</span>
        <button class="modal-close" id="btnCloseEditModal">✕</button>
      </div>
      <form id="editItemForm">
        <input type="hidden" id="editItemId">
        <div class="edit-field-group">
          <label for="editItemName">ITEM NAME</label>
          <input type="text" id="editItemName" class="input-text" placeholder="Item name" required>
        </div>
        <div class="edit-options-row">
          <div class="opt-group">
            <label for="editItemQty">QTY</label>
            <input type="number" id="editItemQty" class="input-text-sm" value="1" min="0" step="any">
          </div>
          <div class="opt-group">
            <label for="editItemUnit">UNIT</label>
            <select id="editItemUnit" class="input-text-sm"></select>
          </div>
          <div class="opt-group">
            <label for="editItemPrice">PRICE ($)</label>
            <input type="number" id="editItemPrice" class="input-text-sm" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div class="modal-footer" style="margin-top: 4px;">
          <button type="button" class="btn-outline" id="btnCancelEditModal">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Options Menu Modal -->
  <div class="modal-backdrop" id="menuModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <span>Settings & Lists</span>
        <button class="modal-close" id="btnCloseMenuModal">✕</button>
      </div>
      <div id="listManagerContainer">
        <!-- Dynamic lists -->
      </div>
      <button id="btnCreateListFromMenu" class="btn-outline" style="width: 100%; margin-top: 12px;">+ New List</button>
    </div>
  </div>

  <!-- Undo bar (shown after Clear Done) -->
  <div class="undo-toast" id="undoToast" hidden>
    <span id="undoText"></span>
    <button type="button" class="btn-primary" id="btnUndo">Undo</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
